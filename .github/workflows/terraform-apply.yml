name: Repo provisioning - apply

on:
  push:
    branches: [main]
    paths:
      - "repos/**"
      - "terraform/**"
      - "policy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-provisioning-apply
  cancel-in-progress: false

jobs:
  # Plans, runs the policy gate, and decides whether a reviewer must approve before apply.
  # Approval is needed for any repo delete, and for any change to a repo matching approval_gate in guardrails.yaml.
  plan:
    name: Plan and decide approval
    runs-on: ubuntu-latest
    outputs:
      approval: ${{ steps.gate.outputs.approval }}
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      GITHUB_OWNER: ${{ vars.REPO_OWNER }}
      GITHUB_APP_ID: ${{ vars.APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Authenticate GitHub App
        env:
          GITHUB_APP_PEM_FILE_CONTENT: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$GITHUB_APP_PEM_FILE_CONTENT" ]; then
            echo "::error::APP_PRIVATE_KEY secret is empty or not available to this workflow"
            exit 1
          fi
          printf '%s\n' "$GITHUB_APP_PEM_FILE_CONTENT" > "$RUNNER_TEMP/app.pem"
          if ! openssl rsa -in "$RUNNER_TEMP/app.pem" -noout -check > /dev/null 2>&1; then
            echo "::error::APP_PRIVATE_KEY is not a valid RSA PEM key. Re-paste the full .pem file into the secret."
            exit 1
          fi
          {
            echo "GITHUB_APP_PEM_FILE<<PEM_EOF"
            cat "$RUNNER_TEMP/app.pem"
            echo "PEM_EOF"
          } >> "$GITHUB_ENV"

      - name: Init
        run: terraform init -input=false
        working-directory: terraform

      - name: Install Conftest
        env:
          CONFTEST_VERSION: 0.56.0
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin conftest

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: terraform

      - name: Show plan as JSON
        run: terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
        working-directory: terraform

      - name: Compliance policy gate
        run: conftest test "$RUNNER_TEMP/plan.json" --policy policy --data policy/guardrails.yaml

      - name: Decide approval environment
        id: gate
        run: |
          APPROVAL=$(jq -r '
            (([.resource_changes[] | select(.type == "github_repository") | select(.change.actions | index("delete"))] | length) > 0)
            or
            (([.resource_changes[] | select(.type == "terraform_data") | select(.change.actions != ["no-op"]) | select(.change.after.input.approval_required == true)] | length) > 0)
          ' "$RUNNER_TEMP/plan.json")
          echo "approval=$APPROVAL" >> "$GITHUB_OUTPUT"
          echo "Approval required: $APPROVAL"

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 7

      - name: Remove PEM
        if: always()
        run: rm -f "$RUNNER_TEMP/app.pem"

  # Runs the saved plan. Uses repo-provisioning-approval (required reviewers) when the plan needs approval.
  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.approval == 'true' && 'repo-provisioning-approval' || 'repo-provisioning-prod' }}
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      GITHUB_OWNER: ${{ vars.REPO_OWNER }}
      GITHUB_APP_ID: ${{ vars.APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Authenticate GitHub App
        env:
          GITHUB_APP_PEM_FILE_CONTENT: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$GITHUB_APP_PEM_FILE_CONTENT" ]; then
            echo "::error::APP_PRIVATE_KEY secret is empty or not available to this workflow"
            exit 1
          fi
          printf '%s\n' "$GITHUB_APP_PEM_FILE_CONTENT" > "$RUNNER_TEMP/app.pem"
          if ! openssl rsa -in "$RUNNER_TEMP/app.pem" -noout -check > /dev/null 2>&1; then
            echo "::error::APP_PRIVATE_KEY is not a valid RSA PEM key. Re-paste the full .pem file into the secret."
            exit 1
          fi
          {
            echo "GITHUB_APP_PEM_FILE<<PEM_EOF"
            cat "$RUNNER_TEMP/app.pem"
            echo "PEM_EOF"
          } >> "$GITHUB_ENV"

      - name: Init
        run: terraform init -input=false
        working-directory: terraform

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: terraform

      - name: Remove PEM
        if: always()
        run: rm -f "$RUNNER_TEMP/app.pem"

  notify:
    name: Comment on request PR
    needs: apply
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      APPLY_RESULT: ${{ needs.apply.result }}
      REPO_OWNER: ${{ vars.REPO_OWNER }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the request PR for this commit
        id: pr
        run: |
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Comment on successful apply
        if: needs.apply.result == 'success' && steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          HEAD=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          NAME=${HEAD#repo-request/}
          FILE="repos/${NAME}.yaml"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found on main"
            exit 1
          fi
          VISIBILITY=$(yq -r '.visibility // "private (default)"' "$FILE")
          CODEOWNERS=$(yq -r '.codeowners' "$FILE")
          TOPICS=$(yq -r '.topics // [] | join(", ")' "$FILE")
          REVIEWS=$(yq -r '.required_reviews // "1 (default)"' "$FILE")
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          Repo \`${NAME}\` has been provisioned.

          - URL: https://github.com/${REPO_OWNER}/${NAME}
          - Visibility: ${VISIBILITY}
          - Codeowners: ${CODEOWNERS}
          - Topics: ${TOPICS:-none}
          - Required reviews: ${REVIEWS}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"

      - name: Comment on failed apply
        if: needs.apply.result != 'success' && steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR" --body "$(printf 'Provisioning failed for this request. Apply job: %s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$RUN_URL")"
