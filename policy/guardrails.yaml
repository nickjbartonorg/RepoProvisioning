# Guardrail settings. This is the only file you need to edit to change a guardrail.
#
# Terraform reads this file to configure repos.
# The policy reads this file to check the plan.
#
# Values: change the value after the colon. Keep the quotes and brackets if present.
# Flags: true = enforced (Terraform sets it, the policy requires it). false = not enforced.
# A repo can turn any enforce_* flag ON in its own YAML (guardrails: section).
# A repo cannot turn a flag OFF if it is ON here. Thresholds below are global.
#
# visibility_profiles tighten these settings for repos of one visibility.
# A profile can turn a flag ON or raise min_required_reviews. It cannot turn a flag OFF
# or lower a minimum. Effective setting = global OR profile OR repo override.
# After editing, open a PR. The plan job shows which repos would fail.

# Naming and visibility
name_pattern: "^[a-z][a-z0-9-]{2,49}$"
allowed_visibility: [public, private]
default_visibility: private

# Approvals
default_required_reviews: 1
min_required_reviews: 1

# Repo settings
enforce_delete_branch_on_merge: true
enforce_vulnerability_alerts: true
enforce_dependabot_security_updates: true
enforce_secret_scanning: false
enforce_push_protection: false

# Default branch protection (a ruleset on the default branch). Rulesets on private repos need GitHub Pro.
enforce_branch_protection: false
enforce_ruleset_block_deletion: true
enforce_ruleset_block_force_push: true
enforce_ruleset_linear_history: true

# Delete protection. true = the policy blocks any plan that deletes a repo with this flag on.
# To remove a protected repo: turn the flag off in its own PR, merge it, then remove the repo file.
enforce_delete_protection: false

# Approval gate. A repo with this risk and visibility needs a reviewer on the approval
# environment before apply (see .github/workflows/terraform-apply.yml). Deletes always need one.
approval_gate:
  risk: high
  visibility: public

# Tighter (or equal) settings by repo visibility. Keys: any enforce_* flag, or min_required_reviews.
visibility_profiles:
  public:
    enforce_branch_protection: true
    enforce_secret_scanning: true
    enforce_push_protection: true
    min_required_reviews: 2
  private: {}
